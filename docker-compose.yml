services:
  interfaces:
    build:
      context: ./uis
      dockerfile: Dockerfile

    ports:
      - "3000:3000"
      - "3001:3001"

    env_file:
      - .env

    environment:
      BACKEND_URL: http://backend:8000

    volumes:
      - ./uis:/app
      - tracker_node_modules:/app/talent-pipeline-tracker/node_modules
      - backoffice_node_modules:/app/backoffice/node_modules

    command: ["sh", "/app/start.sh"]

    depends_on:
      - backend

    networks:
      - company_network

  backend:
    build:
      context: ./services
      dockerfile: Dockerfile

    ports:
      - "8000:8000"

    env_file:
      - ./services/auth-api/.env

    volumes:
      - ./services/auth-api:/app
      - ./services/trackflow-api:/app/trackflow-api

    command:
      [
        "uvicorn",
        "main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload"
      ]

    networks:
      - company_network

networks:
  company_network:
    name: company_network
    driver: bridge

volumes:
  tracker_node_modules:
  backoffice_node_modules: